name: cleanup-ghcr-ga-tags

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List matching versions without deleting'
        type: boolean
        default: true

permissions:
  packages: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Delete the accidentally published 1.0.0 GA image
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: mahoo12138
          PACKAGE: havit
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          api="https://api.github.com/users/$OWNER/packages/container/$PACKAGE/versions?per_page=100"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api" -o /tmp/versions.json
          echo "--- versions before ---"
          jq -r '.[] | "\(.id) \(.metadata.container.tags // [])"' /tmp/versions.json
          ids=$(jq -r '[.[] | select(((.metadata.container.tags // []) | (index("1.0.0") != null or index("latest") != null))) | .id] | unique | .[]' /tmp/versions.json)
          if [ -z "$ids" ]; then
            echo "no GA version found"
            exit 0
          fi
          for id in $ids; do
            if [ "$DRY_RUN" = "true" ]; then
              echo "dry-run: would delete $id"
            else
              code=$(curl -s -o /tmp/delete.json -w "%{http_code}" -X DELETE \
                -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/users/$OWNER/packages/container/$PACKAGE/versions/$id")
              echo "delete $id -> $code"
              [ "$code" = "204" ] || cat /tmp/delete.json
            fi
          done
          echo "--- versions after ---"
          curl -fsS -H "Authorization: Bearer $GH_TOKEN" "$api" \
            | jq -r '.[] | "\(.id) \(.metadata.container.tags // [])"'
